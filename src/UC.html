<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Preference Center - Iframe integration</title>
    <link rel="stylesheet" href="client.css">
</head>
<body>

    <section>
        <form id="iframeIntegrationExampleForm">
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input name="firstName" id="firstName" placeholder="Enter FirstName" />
            </div>
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input name="lastName" id="lastName" placeholder="Enter LastName" />
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="Enter email" required />
                <small id="emailHint" class="field-hint" hidden>Please enter a valid email address.</small>
            </div>

            <!-- Shown after consents are recorded (CONSENTS_RECORDED) or on failure -->
            <div id="pcStatus" class="pc-status" hidden></div>

            <!-- Securiti Universal Preference Center iframe.
                 Credentials (tenantId / preferenceCenterId) live in client.js and are
                 passed to the iframe via the INIT_PREFERENCE_CENTER postMessage event. -->
            <iframe id="preferenceIframe" height="200" src="./iframe/preference-center.html"></iframe>
        </form>
    </section>

    <script src="./client.js"></script>

</body>
</html>
